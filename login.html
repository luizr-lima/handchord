<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D17">
  <title>Login — HandChord</title>
  <meta name="description" content="Acesse sua conta HandChord e continue suas performances.">

  <!-- Ícone da aba: SVG nos navegadores modernos, PNG nos antigos e no iPhone/iPad -->
  <link rel="icon" type="image/svg+xml" href="icones/icone.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icones/png/favicon-32.png">
  <link rel="apple-touch-icon" href="icones/png/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/menu.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <picture>
          <source type="image/svg+xml" srcset="icones/icone.svg">
          <img class="logo-icon" src="icones/png/icone.png" alt="" width="48" height="40">
        </picture>
        <picture>
          <source type="image/svg+xml" srcset="icones/nome.svg">
          <img class="logo-name" src="icones/png/nome.png" alt="HandChord, página inicial" width="126" height="24">
        </picture>
      </a>

      <!-- Menu do celular: o checkbox é focável pelo teclado e funciona sem JavaScript -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menu de navegação" aria-controls="menu-principal">
      <label for="nav-toggle" class="nav-backdrop" aria-hidden="true"></label>
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
        <span></span><span></span><span></span>
      </label>

      <nav class="main-nav" id="menu-principal" aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="como-funciona.html">Como funciona</a></li>
          <li><a href="cadastro.html" class="btn btn-primary btn-sm">Cadastre-se</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1" class="auth-main">
    <div class="container">
      <section class="auth-card" aria-labelledby="login-titulo">
        <div class="auth-badge" aria-hidden="true">
          <picture>
            <source type="image/svg+xml" srcset="icones/icone.svg">
            <img src="icones/png/icone.png" alt="" width="67" height="56">
          </picture>
        </div>
        <h1 id="login-titulo" class="center">Entrar no HandChord</h1>
        <p class="center">Acesse sua área pessoal e continue suas performances.</p>

        <form class="auth-form" id="form-login">
          <div class="form-group">
            <label for="login-id">Usuário ou e-mail</label>
            <input type="text" id="login-id" name="identifier" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="seu@email.com">
          </div>

          <div class="form-group">
            <label for="login-senha">Senha</label>
            <!-- Sem o atributo name de propósito: assim a senha não aparece na barra de endereço enquanto o login não é tratado por JavaScript (etapa 5) -->
            <input type="password" id="login-senha" autocomplete="current-password" required placeholder="Sua senha">
          </div>

          <div class="form-row space-between">
            <label class="checkbox-inline"><input type="checkbox" name="lembrar"> Lembrar de mim</label>
            <a href="#" class="link-muted">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <p class="auth-switch center">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">© 2026 HandChord — S.D.G.</p>
    </div>
  </footer>
</body>
</html>
